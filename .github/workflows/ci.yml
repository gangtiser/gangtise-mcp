name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts: no dependency here needs install-time lifecycle scripts,
      # and skipping them keeps a poisoned transitive dep from executing in CI.
      - run: npm ci --ignore-scripts
      # Runs against the official registry (local npmmirror config can't audit).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      # 对外面自查：工具描述/错误提示的措辞、包内文档、dist 残留注释、tools/list 字节预算。
      # 它需要 dist/，所以排在 build 之后。
      - run: npm run check:release
      - run: npm test
      # 覆盖率阈值按当前实测值设（vitest.config.ts），作用是不许倒退。
      - run: npm run coverage
